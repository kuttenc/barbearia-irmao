name: Publicar Barbearia do Irmão

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Montar arquivos públicos
        run: |
          mkdir -p _site/assets _site/contabilidade/assets
          cp index.html config.js _site/
          cp assets/barbearia-do-irmao.jpeg _site/assets/
          cp contabilidade/index.html _site/contabilidade/
          cp config.js _site/contabilidade/
          cp assets/barbearia-do-irmao.jpeg _site/contabilidade/assets/
          cp .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
